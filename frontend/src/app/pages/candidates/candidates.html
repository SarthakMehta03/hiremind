<div class="candidate-layout">

  <!-- SIDEBAR -->
  <app-sidebar></app-sidebar>

  <!-- MAIN -->
  <div class="candidate-main">

    <!-- NAVBAR -->
    <app-navbar></app-navbar>

    <!-- PAGE -->
    <div class="candidate-page">

      <!-- HEADER -->
      <div class="page-header">

        <div>

          <h1>Candidate Management</h1>

          <p>
            Manage recruitment candidates
          </p>

        </div>

      </div>

      <!-- FORM -->
      <div class="form-card">

        <h2>

          {{ isEditing
            ? 'Edit Candidate'
            : 'Add Candidate'
          }}

        </h2>

        <div class="candidate-form">

          <input
            type="text"
            placeholder="Candidate Name"
            [(ngModel)]="name"
          />

          <input
            type="email"
            placeholder="Email"
            [(ngModel)]="email"
          />

          <input
            type="text"
            placeholder="Skills (comma separated)"
            [(ngModel)]="skills"
          />

          <input
            type="text"
            placeholder="Experience"
            [(ngModel)]="experience"
          />

          <!-- RESUME INPUT -->
          <input
            type="file"
            (change)="onFileSelected($event)"
          />

          <button
            (click)="createCandidate()"
          >

            {{ isEditing
              ? 'Update Candidate'
              : 'Add Candidate'
            }}

          </button>

        </div>

      </div>

      <!-- LIST -->
      <div class="candidate-list">

        <div
          class="candidate-card"
          *ngFor="
            let candidate of candidates;
            trackBy: trackByCandidate
          "
        >

          <h3>
            {{ candidate.name }}
          </h3>

          <p>
            {{ candidate.email }}
          </p>

          <p>
            {{ candidate.experience }}
          </p>

          <!-- SKILLS -->
          <div class="skills">

            <span
              *ngFor="
                let skill of candidate.skills
              "
            >
              {{ skill }}
            </span>

          </div>

          <!-- RESUME LINK -->
          <a
            *ngIf="candidate.resume"
            [href]="
              'http://localhost:5000/' +
              candidate.resume
            "
            target="_blank"
            class="resume-link"
          >

            View Resume

          </a>

          <!-- ACTIONS -->
          <div class="candidate-actions">

            <button
              class="edit-btn"
              (click)="editCandidate(candidate)"
            >
              Edit
            </button>

            <button
              class="delete-btn"
              (click)="
                deleteCandidate(candidate._id)
              "
            >
              Delete
            </button>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>
